name: Java 11 JUnit4

on:
  pull_request:
  push:
    branches: [ main, dev ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Compile
        run: |
          mkdir -p out
          find src -name "*.java" > sources.txt
          javac -source 11 -target 11 -d out @sources.txt
      - name: Run JUnit4 tests
        run: |
          set -e
          # discover tests matching *_Test.class
          TESTS=$(find out -name "*_Test.class" | sed 's#out/##; s#/#.#g; s#.class$##')
          if [ -z "$TESTS" ]; then
            echo "No tests found"; exit 0
          fi
          java -cp out org.junit.runner.JUnitCore $TESTS
