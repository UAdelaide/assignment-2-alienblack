name: Java 11 + JUnit4

on:
  pull_request:
  push:
    branches: [ main, dev ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Fetch JUnit 4 and Hamcrest
        run: |
          curl -sSL -o junit.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSL -o hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          ls -lh junit.jar hamcrest.jar

      - name: Compile (clean out/)
        run: |
          rm -rf out
          mkdir -p out
          find src -name "*.java" > sources.txt
          javac -source 11 -target 11 -cp "junit.jar:hamcrest.jar" -d out @sources.txt

      - name: Run JUnit4 tests
        run: |
          # discover top-level *_Test classes (default package)
          TESTS=$(find out -maxdepth 1 -type f -name "*_Test.class" -exec basename {} .class \;)
          if [ -z "$TESTS" ]; then
            echo "No tests found"
            exit 0
          fi
          echo "Running: $TESTS"
          java -cp "out:junit.jar:hamcrest.jar" org.junit.runner.JUnitCore $TESTS
